on:
  push:
    branches: '**'
  pull_request:
    branches: '**'

name: Test
jobs:
  test:
    strategy:
      matrix:
        go-version: [1.24.x, stable]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    - run: go vet ./...
    # Space-separated flag form: PowerShell splits -coverprofile=value on '='
    - run: go test -race -count=1 -v -coverprofile coverage.out .
    - uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.out
        fail_ci_if_error: false
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v5
      with:
        go-version: stable
    - uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13.2
  # The eval tools are separate modules with third-party deps and no tests
  # of their own; gate them on build + vet only.
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [eval/bench, eval/compare, eval/uniqcheck]
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Build and vet
      working-directory: ${{ matrix.module }}
      run: |
        go build ./...
        go vet ./...
