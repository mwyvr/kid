version: "2"
run:
  concurrency: 4
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - gocritic
    - gosec
    - govet
    - revive
    - staticcheck
    - unused
  settings:
    govet:
      enable:
        - shadow
    gocritic:
      enabled-checks:
        - hugeParam
    gosec:
      excludes:
        # G404: math/rand/v2 is a deliberate, documented choice (see the
        # package security note); IDs are predictable by design.
        - G404
        # G115: all conversions are over fixed-width ID fields and are safe
        # by construction.
        - G115
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - vendor/
      - tmp/
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      module-path: ""
  exclusions:
    generated: lax
    paths:
      - vendor/
      - tmp/
      - third_party$
      - builtin$
      - examples$
